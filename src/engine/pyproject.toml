[project]
name = "slide-wright-engine"
version = "0.1.0"
description = "Slide-Wright presentation engine: ingest, inspect, verify and safely edit PowerPoint files"
requires-python = ">=3.11"
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["slide_wright*"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]
pythonpath = ["."]
