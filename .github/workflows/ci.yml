name: CI

# The upstream engine ships 174k lines of Python producing binary output with
# no CI at all. Our guarantee is checkable by arithmetic, so not checking it
# continuously would be negligent.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: Engine tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux, plus one run each on the platforms
        # the users are on. This engine opens zip archives, writes next to the
        # user's deck and holds file handles across a save -- all three behave
        # differently on Windows, and nothing had ever run there. The analyst
        # this product is for is on Windows; so is the person who wrote it,
        # which is how a green tick on Linux stayed convincing for so long.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/engine[dev]"

      # Scoped to the engine's own tests on purpose. This job installs the
      # engine and nothing else, which is what makes it evidence that the
      # engine stands alone -- it must not import the product surface. Running
      # the whole tests/ tree here would collect tests/product/ and fail on a
      # missing import, turning a useful isolation property into a packaging
      # error. The product tests run in their own job, with both installed.
      - name: Test
        run: python -m pytest tests/engine tests/test_repo_hygiene.py -v --tb=short

  product:
    name: Product surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/product/web/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/engine[dev]"
          pip install -e "src/product/api[dev]"
          npm --prefix src/product/web ci

      - name: Client typecheck
        run: npm --prefix src/product/web run typecheck

      - name: Client tests
        run: npm --prefix src/product/web test

      - name: Client builds
        run: npm --prefix src/product/web run build

      # After the client build, deliberately. tests/product/test_packaging.py
      # builds a wheel and asserts the client is inside it, which it can only
      # do once there is a client to package -- run earlier, those tests skip,
      # and a skipped test is not a guard. The step below makes that
      # unskippable regardless of what this file is reordered into.
      - name: API tests
        run: python -m pytest tests/product -v --tb=short

      # ADR-0008: the client must load with the network unplugged. A build that
      # fetches from an external origin breaks that silently -- the page still
      # works on the machine that built it and fails on an air-gapped one.
      #
      # Matched on positions that actually load something. A bare URL is not a
      # fetch: React ships doc links inside its error messages and Tailwind
      # writes its own homepage into a CSS comment, and failing on those would
      # be a guard nobody could keep green.
      - name: Assert the client loads nothing from outside
        run: |
          if grep -rnoE '(src|href)="https?://|url\(["'"'"']?https?://|@import[^;]*https?://|from *["'"'"']https?://|import\(["'"'"']https?://|fetch\(["'"'"']https?://'                src/product/web/dist/ --include='*.html' --include='*.css' --include='*.js'; then
            echo "FAIL the built client loads from an external origin"
            exit 1
          fi
          echo "client is self-contained"

      # The release artifact, checked as an artifact rather than as a checkout.
      # `pip install` shipped an API and no interface for the whole life of the
      # product surface while every test stayed green, because every test runs
      # from the source tree -- the one place the bug does not reproduce.
      #
      # Deliberately not a pytest skip. The equivalent tests skip when no client
      # has been built, which is right on a dev machine and useless as a release
      # gate; this step cannot skip.
      - name: Assert the wheel a user installs contains the interface
        run: |
          python -m pip wheel --no-deps --no-build-isolation -w wheelout src/product/api
          python scripts/assert_wheel_has_client.py wheelout

      # ADR-0011. This used to be three greps: does __main__.py still contain
      # HOST = "127.0.0.1", is --host still absent, does nothing bind 0.0.0.0.
      # They were real safeguards with one weakness -- they protected the
      # promise by making a server impossible to *express*, so the first time
      # somebody legitimately needed one, the only move was to delete the guard.
      #
      # The mode is explicit now, so the guard runs the resolver instead of
      # matching text: nothing configured is local on loopback with no token,
      # local refuses to be pointed elsewhere rather than ignoring the attempt,
      # and self-hosted will not start without authentication. A grep can be
      # satisfied by a comment; this cannot.
      - name: Assert the local mode cannot be configured away
        run: python scripts/assert_local_mode_is_sealed.py

  fidelity-corpus:
    name: Fidelity corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/engine[dev]"

      # The corpus is only meaningful if the adversarial deck is genuinely
      # adversarial. A regression that quietly simplified the generator would
      # make every downstream fidelity result worthless.
      - name: Assert the corpus deck still contains hard constructs
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src/engine")
          from pathlib import Path
          from slide_wright.corpus.synthesize import build_adversarial, build_minimal
          from slide_wright.corpus.profile import profile

          out = Path("tests/corpus")
          adversarial = profile(build_adversarial(out / "ci-adversarial.pptx"))
          minimal = profile(build_minimal(out / "ci-minimal.pptx"))

          required = {
              "native_charts", "embedded_workbooks", "grouped_shapes",
              "tables", "custom_geometry", "hyperlinks", "notes",
          }
          missing = required - set(adversarial.present_constructs)
          if missing:
              print(f"FAIL corpus lost constructs: {sorted(missing)}")
              sys.exit(1)
          if minimal.difficulty != 0:
              print("FAIL control deck is no longer a control")
              sys.exit(1)
          print(f"corpus OK  adversarial difficulty={adversarial.difficulty} "
                f"control difficulty={minimal.difficulty}")
          PY

      # The compatibility table is generated by running the engine. A row can
      # only say PRESERVED because a deck here contained the construct and
      # survived an edit -- so the useful guard is that nobody has hand-written
      # one. CI has only the synthetic corpus, no third-party fixtures, so the
      # table it produces is smaller than the checked-in one and is compared for
      # shape rather than contents: UNKNOWN must still be reachable, and a
      # verdict must still require a measurement.
      - name: Assert the compatibility matrix is measured, not asserted
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "src/engine")
          from slide_wright.compatibility import CONSTRUCTS, Construct, Row, UNKNOWN

          described = Construct(
              "Invented", marker="<x:nope",
              refused_because="nowhere.py", note="surely this is fine",
          )
          if Row(construct=described).verdict != UNKNOWN:
              print("FAIL a construct with no measurement got a verdict")
              sys.exit(1)
          for construct in CONSTRUCTS:
              if not (construct.marker or construct.part):
                  print(f"FAIL {construct.name} can never be detected")
                  sys.exit(1)
          print(f"compatibility matrix OK  {len(CONSTRUCTS)} constructs, "
                "none verdicted without a measurement")
          PY

  hygiene:
    name: Licence and secret hygiene
    runs-on: ubuntu-latest
    steps:
      # Full history on purpose. actions/checkout defaults to a shallow clone,
      # which would leave the authorship and AI-trailer assertions inspecting
      # a single commit while still reporting green -- a guard that looks
      # enforced and is not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "src/engine[dev]"

      # These assert over the whole history, so they belong in this job rather
      # than the shallow-cloned matrix above.
      - name: Repository hygiene (full history)
        run: python -m pytest tests/test_repo_hygiene.py -v

      # ADR-0006: the unsafe export path must never reappear.
      - name: Assert the native chart/table rail is intact
        run: |
          if ! grep -rq -- "--native-charts-and-tables" src/engine/slide_wright/engines/; then
            echo "FAIL ADR-0006 rail missing from the engine adapter"
            exit 1
          fi
          echo "ADR-0006 rail present"

      # Private project intelligence must never enter history.
      - name: Assert private docs are not tracked
        run: |
          if git ls-files | grep -q "^private/"; then
            echo "FAIL private/ files are tracked"
            git ls-files | grep "^private/"
            exit 1
          fi
          echo "private/ is untracked"

      - name: Assert no obvious secrets are tracked
        run: |
          if git ls-files | grep -qE "\.env$|\.pem$|\.key$|credentials\.json"; then
            echo "FAIL secret-shaped file is tracked"
            exit 1
          fi
          echo "no secret-shaped files tracked"

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built here because it cannot be built where it is written: the author's
      # machine has no Docker, so an unbuilt Dockerfile would be a deployment
      # artifact nobody had ever run. This job is what makes it verified rather
      # than plausible.
      - name: Build
        run: docker build -t slide-wright:ci .

      - name: It refuses to start unconfigured
        run: |
          if docker run --rm slide-wright:ci; then
            echo "FAIL the container started with no mode, hostname or token"
            exit 1
          fi
          echo "refused, as ADR-0011 requires"

      - name: It refuses to start without a token
        run: |
          if docker run --rm -e SLIDE_WRIGHT_MODE=self-hosted slide-wright:ci; then
            echo "FAIL the container started unauthenticated"
            exit 1
          fi
          echo "refused"

      - name: Start it, properly configured
        run: |
          mkdir -p decks
          python -m pip install --quiet -e "src/engine"
          python -c "
          from pathlib import Path
          from slide_wright.corpus.synthesize import build_adversarial
          build_adversarial(Path('decks/ci.pptx'))
          "
          echo "SW_TOKEN=$(python -c 'import secrets;print(secrets.token_urlsafe(32))')" >> $GITHUB_ENV

      - name: Run
        run: |
          # --user, because the image runs as uid 10001 and the volume
          # belongs to the runner. The engine keeps versions in a
          # .slidewright folder *beside the deck*, so a deck directory the
          # process cannot write to opens and then fails to save. An
          # operator mounting a directory owned by somebody else hits the
          # same wall, which is why it is in the guide and not only here.
          docker run -d --name sw -p 8787:8787 \
            --user "$(id -u):$(id -g)" \
            -e SLIDE_WRIGHT_MODE=self-hosted \
            -e SLIDE_WRIGHT_HOSTNAME=slidewright.ci \
            -e SLIDE_WRIGHT_TOKEN="$SW_TOKEN" \
            -v "$PWD/decks:/decks" \
            slide-wright:ci
          for _ in $(seq 1 40); do
            if curl -fsS -H "Host: slidewright.ci" http://127.0.0.1:8787/api/ping >/dev/null; then
              break
            fi
            sleep 2
          done
          docker logs sw

      - name: What it serves, and what it refuses
        run: python scripts/assert_container_enforces.py

      - name: What the container said, if it did not
        if: failure()
        run: |
          echo "-- container log --"
          docker logs sw 2>&1 | tail -60
          echo "-- the volume it was given --"
          ls -la decks
          id

      - name: The health check the orchestrator will run
        run: docker inspect --format '{{.State.Health.Status}}' sw || true

      - name: Stop
        if: always()
        run: docker rm -f sw || true
