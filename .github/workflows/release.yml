name: Release

# A tag produces the two wheels a user installs, and nothing else does.
#
# There is no package index to publish to yet -- that needs an account only the
# owner can create -- so the release itself is the distribution channel. That is
# a smaller thing than PyPI and it is a real one: the wheels are built from the
# tagged commit, checked, and attached where anyone can fetch them.
#
# The client is built first, in this job, because the API wheel carries it. A
# release built in the wrong order ships an interface-less product, which is
# exactly what happened before anything checked.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish the release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/product/web/package-lock.json

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      # Before the wheels, not after. The API wheel copies whatever is in
      # web/dist at build time, so this ordering is load-bearing.
      - name: Build the client
        run: |
          npm --prefix src/product/web ci
          npm --prefix src/product/web run build

      - name: Assert the client loads nothing from outside
        run: |
          if grep -rnoE '(src|href)="https?://|url\(["'"'"']?https?://|@import[^;]*https?://|from *["'"'"']https?://|import\(["'"'"']https?://|fetch\(["'"'"']https?://' src/product/web/dist/ --include='*.html' --include='*.css' --include='*.js'; then
            echo "FAIL the built client loads from an external origin"
            exit 1
          fi
          echo "client is self-contained"

      - name: Build the engine distribution
        run: python -m build --outdir dist-release src/engine

      - name: Build the product distribution
        run: python -m build --outdir dist-api src/product/api

      - name: Assert the wheel a user installs contains the interface
        run: python scripts/assert_wheel_has_client.py dist-api

      - name: Collect
        run: |
          mkdir -p release
          cp dist-release/* dist-api/* release/
          ls -la release/

      # The proof that the artifacts work, performed on the artifacts, in a
      # clean environment with no checkout on the path. Everything else in this
      # repository is tested from the source tree.
      - name: Install the release into a clean environment and use it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet release/*.whl
          /tmp/smoke/bin/python scripts/release_smoke_test.py

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
